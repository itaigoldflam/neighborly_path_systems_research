[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "path-systems-lib"
version = "0.1.0"
description = "Shared core library for neighborly wheel systems, metrizability, and path-system research"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "networkx",
    "gurobipy",
    "tqdm",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]
